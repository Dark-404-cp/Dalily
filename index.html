<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>دليلى — Dalily</title>
    <style>
        :root {
            --or: #FF7A00;
            --navy: #0F1F3D;
            --nb: #0F1F3D;
            --gr: #1FA971;
            --bg: #F6F8FB;
            --card: #fff;
            --tx: #0F1F3D;
            --mu: #6b7690;
            --ln: #e3e8f0;
            --red: #d64545;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        * {
            box-sizing: border-box
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Arial, sans-serif;
            background: var(--bg);
            color: var(--tx);
            min-height: 100vh;
            background-image: radial-gradient(circle at 100% 0, rgba(255, 122, 0, .14), transparent 45%)
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 1.4rem;
            color: var(--or)
        }

        .logo i {
            font-style: normal;
            width: 38px;
            height: 38px;
            border-radius: 9px;
            background: var(--or);
            color: #fff;
            display: grid;
            place-items: center;
            font-size: 1.5rem
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            background: var(--card);
            border-bottom: 1px solid var(--ln);
            flex-wrap: wrap
        }

        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 18px
        }

        .card {
            background: var(--card);
            border: 1px solid var(--ln);
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 16px
        }

        h2,
        h3 {
            margin: 0 0 12px
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--ln);
            border-radius: 9px;
            font: inherit;
            background: var(--bg);
            color: var(--tx);
            margin-bottom: 10px
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: 2px solid var(--or);
            border-color: var(--or)
        }

        button {
            font: inherit;
            cursor: pointer;
            border: 0;
            border-radius: 9px;
            padding: 9px 16px;
            font-weight: 600
        }

        .b-or {
            background: var(--or);
            color: #fff
        }

        .b-nv {
            background: var(--nb);
            color: #fff
        }

        .b-gr {
            background: var(--gr);
            color: #fff
        }

        .b-rd {
            background: var(--red);
            color: #fff
        }

        .b-ln {
            background: transparent;
            border: 1px solid var(--ln);
            color: var(--tx)
        }

        .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center
        }

        .row>* {
            flex: 1
        }

        .login {
            max-width: 420px;
            margin: 6vh auto;
            text-align: center
        }

        .tabs {
            display: flex;
            gap: 6px;
            margin: 14px 0
        }

        .tabs button {
            flex: 1;
            background: var(--bg);
            color: var(--tx)
        }

        .tabs button.on {
            background: var(--nb);
            color: #fff
        }

        .demo {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 8px
        }

        .demo button {
            font-size: .8rem;
            padding: 6px 10px
        }

        .err {
            color: var(--red);
            min-height: 1.2em;
            font-size: .9rem
        }

        .chips {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 10px 0
        }

        .chips button {
            background: var(--card);
            border: 1px solid var(--ln);
            color: var(--tx);
            border-radius: 20px
        }

        .chips button.on {
            background: var(--nb);
            color: #fff
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 14px
        }

        .p {
            background: var(--card);
            border: 1px solid var(--ln);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column
        }

        .p .im {
            height: 130px;
            display: grid;
            place-items: center;
            font-size: 3.2rem;
            background: linear-gradient(135deg, #fff1e2, #e8eefb)
        }

        .p .im img {
            width: 100%;
            height: 100%;
            object-fit: cover
        }

        .p .bd {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1
        }

        .price,
        .ok {
            color: var(--gr);
            font-weight: 700
        }

        .no {
            color: var(--red);
            font-weight: 700
        }

        .mu {
            color: var(--mu);
            font-size: .85rem
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 16px
        }

        .stat {
            background: var(--card);
            border: 1px solid var(--ln);
            border-radius: 14px;
            padding: 16px;
            border-inline-start: 5px solid var(--nb)
        }

        .stat b {
            display: block;
            font-size: 1.7rem;
            color: var(--or)
        }

        .tw {
            overflow-x: auto
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 560px
        }

        th,
        td {
            padding: 9px;
            text-align: start;
            border-bottom: 1px solid var(--ln)
        }

        th {
            color: var(--mu);
            font-size: .85rem
        }

        .sw {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px
        }

        .sw input {
            opacity: 0;
            width: 0;
            height: 0;
            margin: 0
        }

        .sw span {
            position: absolute;
            inset: 0;
            background: #b5bccb;
            border-radius: 24px;
            cursor: pointer;
            transition: .2s
        }

        .sw span:before {
            content: "";
            position: absolute;
            width: 18px;
            height: 18px;
            top: 3px;
            inset-inline-start: 3px;
            background: #fff;
            border-radius: 50%;
            transition: .2s
        }

        .sw input:checked+span {
            background: var(--gr)
        }

        .sw input:checked+span:before {
            inset-inline-start: 23px
        }

        .two {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px
        }

        @media(max-width:760px) {
            .two {
                grid-template-columns: 1fr
            }
        }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .5);
            display: none;
            place-items: center;
            z-index: 50;
            padding: 16px
        }

        .modal.show {
            display: grid
        }

        .modal .card {
            max-width: 440px;
            width: 100%;
            max-height: 85vh;
            overflow: auto;
            margin: 0
        }

        .ci {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 8px 0;
            border-bottom: 1px solid var(--ln)
        }

        .tag {
            padding: 2px 9px;
            border-radius: 12px;
            font-size: .78rem;
            font-weight: 700;
            color: #fff
        }

        .pending {
            background: var(--or)
        }

        .approved {
            background: var(--gr)
        }

        .rejected {
            background: var(--red)
        }

        .hide {
            display: none !important
        }

        .prev {
            max-height: 90px;
            border-radius: 8px;
            margin-bottom: 8px
        }

        .uh {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 20px;
            background: var(--card);
            border-bottom: 1px solid var(--ln);
            box-shadow: 0 2px 10px rgba(15, 31, 61, .05);
            border-radius: 0 0 18px 18px
        }

        .uh .srch {
            flex: 1;
            margin: 0;
            border-radius: 12px;
            background: #fff
        }

        .pill {
            background: var(--navy);
            color: #fff;
            padding: 11px 20px;
            border-radius: 12px;
            font-weight: 700;
            white-space: nowrap
        }

        .dash {
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap
        }

        .cart {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 18px;
            border-radius: 14px;
            white-space: nowrap
        }

        .cnt {
            background: var(--navy);
            color: #fff;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: grid;
            place-items: center;
            font-size: .8rem
        }

        .shop {
            display: grid;
            grid-template-columns: 290px 1fr;
            gap: 24px;
            align-items: start
        }

        .side {
            background: #fff;
            border: 1px solid var(--ln);
            border-radius: 18px;
            padding: 20px;
            position: sticky;
            top: 12px
        }

        .side h4 {
            margin: 0 0 12px
        }

        .side .cb {
            display: block;
            width: 100%;
            margin-bottom: 10px;
            border: 1px solid var(--ln);
            background: #fff;
            color: var(--navy);
            border-radius: 24px;
            padding: 11px
        }

        .side .cb.on {
            background: var(--or);
            border-color: var(--or);
            color: #fff
        }

        .ttl {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 14px
        }

        .ttl h2 {
            margin: 0
        }

        .g4 {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 16px
        }

        .pc {
            background: #fff;
            border: 1px solid var(--ln);
            border-radius: 18px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px
        }

        .pc .im {
            height: 190px;
            border-radius: 14px;
            background: #FFF0E2;
            display: grid;
            place-items: center;
            font-size: 4rem;
            overflow: hidden
        }

        .pc .im img {
            width: 100%;
            height: 100%;
            object-fit: cover
        }

        .pc .pr {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
            min-height: 34px
        }

        .pc .pr .price {
            font-size: 1.15rem
        }

        .bd2 {
            font-size: .78rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 14px
        }

        .bd2.in {
            background: #dff5ec;
            color: var(--gr)
        }

        .bd2.low {
            background: #ffe9d3;
            color: var(--or)
        }

        .bd2.out {
            background: #fde2e2;
            color: var(--red)
        }

        .pc button.b-nv {
            border-radius: 12px;
            padding: 13px;
            margin-top: auto
        }

        @media(max-width:820px) {
            .shop {
                grid-template-columns: 1fr
            }

            .side {
                position: static
            }

            .uh {
                flex-wrap: wrap
            }

            .uh .srch {
                order: 9;
                flex-basis: 100%
            }
        }
    </style>
</head>

<body>
    <div id="app"></div>
    <div class="modal" id="modal">
        <div class="card" id="mbody"></div>
    </div>
    <script>
        /* ===== State (in-memory demo data) ===== */
        const CATS = ['جرابات', 'اسكرينات', 'شواحن', 'كابلات'], PHONES = ['iPhone 15 Pro', 'Samsung S24 Ultra', 'Xiaomi 13T'];
        const EM = { 'جرابات': '📱', 'اسكرينات': '🛡️', 'شواحن': '🔌', 'كابلات': '🔗' };
        const S = {
            role: null, name: '', q: '', cat: 'الكل', ph: 'الكل', cart: [], mode: 'login', myStore: 's1', csv: [], img: '',
            stores: [{ id: 's1', name: 'الجرابات والإكسسوارات', area: 'الفيوم', status: 'approved' }, { id: 's2', name: 'عالم الشواحن', area: 'القاهرة', status: 'approved' }, { id: 's3', name: 'ستايل كيس', area: 'الجيزة', status: 'pending' }],
            products: [
                { id: 1, store: 's1', name: 'جراب سيليكون مضاد للصدمات', cat: 'جرابات', phone: 'iPhone 15 Pro', price: 250, desc: '', q: 20, stock: true, hidden: false },
                { id: 2, store: 's1', name: 'جراب جلد فاخر MagSafe', cat: 'جرابات', phone: 'iPhone 15 Pro', price: 480, desc: '', q: 20, stock: true, hidden: false },
                { id: 3, store: 's1', name: 'جراب شفاف مقوى', cat: 'جرابات', phone: 'Samsung S24 Ultra', price: 180, desc: '', q: 3, stock: true, hidden: false },
                { id: 4, store: 's1', name: 'جراب حماية ثقيلة', cat: 'جرابات', phone: 'Samsung S24 Ultra', price: 320, desc: '', q: 20, stock: true, hidden: false },
                { id: 5, store: 's1', name: 'جراب سيليكون ناعم', cat: 'جرابات', phone: 'Xiaomi 13T', price: 150, desc: '', q: 20, stock: true, hidden: false },
                { id: 6, store: 's1', name: 'اسكرين زجاج 9H', cat: 'اسكرينات', phone: 'iPhone 15 Pro', price: 90, desc: '', q: 20, stock: true, hidden: false },
                { id: 7, store: 's1', name: 'اسكرين خصوصية', cat: 'اسكرينات', phone: 'Samsung S24 Ultra', price: 140, desc: '', q: 20, stock: true, hidden: false },
                { id: 8, store: 's0', name: 'اسكرين نانو مرن', cat: 'اسكرينات', phone: 'Xiaomi 13T', price: 70, desc: '', q: 0, stock: false, hidden: false },
                { id: 9, store: 's2', name: 'شاحن سريع 33 واط', cat: 'شواحن', phone: 'Samsung S24 Ultra', price: 220, desc: '', q: 20, stock: true, hidden: false },
                { id: 10, store: 's2', name: 'شاحن لاسلكي MagSafe', cat: 'شواحن', phone: 'iPhone 15 Pro', price: 390, desc: '', q: 20, stock: true, hidden: false },
                { id: 11, store: 's2', name: 'شاحن سيارة مزدوج', cat: 'شواحن', phone: 'Xiaomi 13T', price: 130, desc: '', q: 20, stock: true, hidden: false },
                { id: 12, store: 's2', name: 'كابل Type-C مقوى', cat: 'كابلات', phone: 'Samsung S24 Ultra', price: 85, desc: '', q: 20, stock: true, hidden: false },
                { id: 13, store: 's2', name: 'كابل Lightning 1م', cat: 'كابلات', phone: 'iPhone 15 Pro', price: 110, desc: '', q: 20, stock: true, hidden: false },
                { id: 14, store: 's3', name: 'جراب جلد كلاسيك', cat: 'جرابات', phone: 'iPhone 15 Pro', price: 200, desc: '', q: 20, stock: true, hidden: false }],
            sales: 0, nid: 10
        };
        const $ = s => document.querySelector(s);
        const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const storeOf = id => S.stores.find(s => s.id === id) || { name: '—', status: 'rejected' };
        const visible = p => !p.hidden && storeOf(p.store).status === 'approved';
        const icon = p => p.img ? `<img src="${p.img}" alt="">` : (p.e || EM[p.cat] || '📦');
        const fmt = n => Number(n).toLocaleString('ar-EG') + ' ج.م';

        /* ===== Auth ===== */
        const USERS = { user: ['user', 'user'], 'Store Owner': ['Store Owner', 'Store Owner'], admin: ['admin', 'admin'] };
        function login() {
            const u = $('#u').value.trim(), p = $('#pw').value, hit = USERS[u];
            if (S.mode === 'reg') {
                if (!u || !p || !$('#nm').value.trim()) { $('#err').textContent = 'أكمل جميع الحقول'; return }
                USERS[u] = [p, 'user']; S.role = 'user'; S.name = $('#nm').value.trim(); return render()
            }
            if (!hit || hit[0] !== p) { $('#err').textContent = 'بيانات الدخول غير صحيحة'; return }
            const r = hit[1]; S.role = r === 'user' ? 'user' : r === 'Store Owner' ? 'store' : 'admin'; S.name = u; render();
        }
        function logout() { S.role = null; S.cart = []; render() }
        function demo(u, p) { $('#u').value = u; $('#pw').value = p; login() }
        function setMode(m) { S.mode = m; render() }

        /* ===== Views ===== */
        function viewLogin() {
            return `<div class="card login"><span class="logo"><i>د</i>دليلى</span>
 <p class="mu">سوق محلي ومنصة تجارة إلكترونية</p>
 <div class="tabs"><button class="${S.mode === 'login' ? 'on' : ''}" onclick="setMode('login')">تسجيل الدخول</button><button class="${S.mode === 'reg' ? 'on' : ''}" onclick="setMode('reg')">حساب عميل جديد</button></div>
 ${S.mode === 'reg' ? '<input id="nm" placeholder="الاسم الكامل">' : ''}
 <input id="u" placeholder="اسم المستخدم" autocomplete="username"><input id="pw" type="password" placeholder="كلمة المرور" onkeydown="if(event.key==='Enter')login()">
 <div class="err" id="err"></div><button class="b-or" style="width:100%" onclick="login()">${S.mode === 'reg' ? 'إنشاء حساب' : 'دخول'}</button>
 <p class="mu">بيانات تجريبية (اضغط للدخول):</p>
 <div class="demo"><button class="b-ln" onclick="demo('user','user')">user</button><button class="b-ln" onclick="demo('Store Owner','Store Owner')">Store Owner</button><button class="b-ln" onclick="demo('admin','admin')">admin</button></div></div>`}

        function head(t, extra = '') { return `<header><span class="logo"><i>د</i>دليلى</span><b>${t} — ${esc(S.name)}</b><div class="row" style="flex:none">${extra}<button class="b-ln" onclick="logout()">خروج</button></div></header>` }

        const list = () => { const q = S.q.trim().toLowerCase(); return S.products.filter(p => visible(p) && (S.cat === 'الكل' || p.cat === S.cat) && (S.ph === 'الكل' || p.phone === S.ph) && (p.name + ' ' + p.phone).toLowerCase().includes(q)) };
        const badge = p => !p.stock ? '<span class="bd2 out">نفد المنتج</span>' : p.q <= 5 ? `<span class="bd2 low">كمية محدودة (${Number(p.q).toLocaleString('ar-EG')})</span>` : '<span class="bd2 in">متوفر</span>';
        function viewUser() {
            return `<header class="uh"><span class="logo"><i>د</i>دليلى</span><span 
 <input id="q" class="srch" placeholder="ابحث عن منتج أو موديل أو SKU..." value="${esc(S.q)}" oninput="S.q=this.value;grid()">
 <button class="b-or cart" onclick="openCart()"><span class="cnt" id="cc">${S.cart.length}</span>السلة 🛒</button></header>
 <main><div class="shop"><aside class="side"><h4>الفئة</h4>${['الكل', ...CATS].map(c => `<button class="cb ${S.cat === c ? 'on' : ''}" onclick="S.cat='${c}';render()">${c}</button>`).join('')}
 <h4 style="margin-top:20px">توافق الهاتف</h4><select onchange="S.ph=this.value;render()">${['الكل', ...PHONES].map(c => `<option ${S.ph === c ? 'selected' : ''}>${c}</option>`).join('')}</select>
 <button class="cb" onclick="S.cat='الكل';S.ph='الكل';S.q='';render()">مسح الفلاتر</button></aside>
 <section><div class="ttl"><h2>المنتجات</h2><span class="mu" id="cnt"></span></div><div class="g4" id="grid"></div></section></div></main>`}
        function gridHtml(l) { return l.length ? l.map(p => `<div class="pc"><div class="im">${icon(p)}</div><b>${esc(p.name)}</b><span class="mu">${esc(p.phone || '')}</span><div class="pr">${badge(p)}<span class="price">${fmt(p.price)}</span></div><button class="b-nv" ${p.stock ? '' : 'disabled style="opacity:.5;cursor:not-allowed"'} onclick="add(${p.id})">أضف إلى السلة</button></div>`).join('') : '<p class="mu">لا توجد منتجات مطابقة.</p>' }
        function grid() { const l = list(); $('#grid').innerHTML = gridHtml(l); $('#cnt').textContent = l.length.toLocaleString('ar-EG') + ' منتج' }
        function add(id) { S.cart.push(id); render2() }
        function openCart() {
            const items = S.cart.map((id, i) => ({ p: S.products.find(x => x.id === id), i })), tot = items.reduce((s, x) => s + x.p.price, 0);
            modal(`<h3>السلة</h3>${items.length ? items.map(x => `<div class="ci"><span>${esc(x.p.name)}</span><span class="price">${fmt(x.p.price)}</span><button class="b-ln" onclick="S.cart.splice(${x.i},1);openCart();render2()">✕</button></div>`).join('') + `<p>الإجمالي: <b class="price">${fmt(tot)}</b></p><button class="b-or" style="width:100%" onclick="checkout()">إتمام الطلب</button>` : '<p class="mu">السلة فارغة</p>'}<button class="b-ln" style="width:100%;margin-top:8px" onclick="closeM()">إغلاق</button>`)
        }
        function render2() { const b = $('#cc'); if (b) b.textContent = S.cart.length }
        function checkout() {
            const items = S.cart.map(id => S.products.find(x => x.id === id)), tot = items.reduce((s, p) => s + p.price, 0); S.sales += tot; S.cart = [];
            modal(`<h3>✅ تم إرسال طلبك!</h3><p>عدد المنتجات: ${items.length}</p><p>الإجمالي: <b class="price">${fmt(tot)}</b></p><button class="b-or" style="width:100%" onclick="closeM();render()">متابعة التسوق</button>`)
        }

        function viewStore() {
            const mine = S.products.filter(p => p.store === S.myStore), st = storeOf(S.myStore), cats = new Set(mine.map(p => p.cat)).size;
            return head('لوحة صاحب المحل') + `<main>
 <div class="stats"><div class="stat">المنتجات المعروضة<b>${mine.length}</b></div><div class="stat">عدد التصنيفات<b>${cats}</b></div><div class="stat">إجمالي المبيعات<b>${S.sales} EGP</b></div></div>
 <div class="two"><div class="card"><h3>إنشاء بيانات المحل</h3><p class="mu">المحل الحالي: <b>${esc(st.name)}</b> <span class="tag ${st.status}">${{ pending: 'قيد المراجعة', approved: 'معتمد', rejected: 'مرفوض' }[st.status]}</span></p>
 <input id="sn" placeholder="اسم المحل"><input id="sa" placeholder="المنطقة / العنوان"><button class="b-nv" onclick="newStore()">تسجيل المحل للمراجعة</button></div>
 <div class="card"><h3>إضافة منتج</h3><input id="pn" placeholder="اسم المنتج"><div class="row"><input id="pp" type="number" min="0" placeholder="السعر (EGP)"><select id="pc">${CATS.map(c => `<option>${c}</option>`).join('')}</select></div>
 <select id="pph">${PHONES.map(c => `<option>${c}</option>`).join('')}</select><textarea id="pd" rows="2" placeholder="الوصف"></textarea><input type="file" accept="image/*" onchange="prevImg(this)"><div id="pv"></div>
 <label class="row" style="gap:8px"><span class="sw" style="flex:none"><input type="checkbox" id="ps" checked><span></span></span><span style="flex:1">متوفر</span></label>
 <button class="b-or" onclick="addProd()">إضافة المنتج</button></div></div>
 <div class="card"><h3>رفع ملف Excel / CSV</h3><p class="mu">الأعمدة: الاسم, السعر, التصنيف, الوصف (احفظ ملف Excel بصيغة CSV)</p>
 <input type="file" accept=".csv,.txt" onchange="readCsv(this)"><div id="csvp"></div></div>
 <div class="card"><h3>إدارة منتجاتي</h3><div class="tw"><table><tr><th>المنتج</th><th>التصنيف</th><th>السعر</th><th>التوفر</th><th></th></tr>
 ${mine.map(p => `<tr><td>${esc(p.name)}${p.hidden ? ' <span class="tag rejected">مخفي</span>' : ''}</td><td>${esc(p.cat)}</td><td class="price">${p.price} EGP</td>
 <td><label class="sw"><input type="checkbox" ${p.stock ? 'checked' : ''} onchange="tog(${p.id})"><span></span></label> ${p.stock ? 'متوفر' : 'غير متوفر'}</td>
 <td><button class="b-ln" onclick="editP(${p.id})">تعديل</button> <button class="b-rd" onclick="delP(${p.id})">حذف</button></td></tr>`).join('') || '<tr><td colspan="5" class="mu">لا توجد منتجات</td></tr>'}</table></div></div></main>`
        }
        function newStore() { const n = $('#sn').value.trim(); if (!n) return; const id = 's' + (S.nid++); S.stores.push({ id, name: n, area: $('#sa').value.trim(), status: 'pending' }); S.myStore = id; render() }
        function prevImg(i) { const f = i.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { S.img = r.result; $('#pv').innerHTML = `<img class="prev" src="${S.img}">` }; r.readAsDataURL(f) }
        function addProd() {
            const n = $('#pn').value.trim(), pr = parseFloat($('#pp').value); if (!n || isNaN(pr)) { alert('أدخل الاسم والسعر'); return }
            S.products.push({ id: S.nid++, store: S.myStore, name: n, price: pr, cat: $('#pc').value, desc: $('#pd').value, phone: $('#pph').value, q: 20, stock: $('#ps').checked, hidden: false, img: S.img }); S.img = ''; render()
        }
        function tog(id) { const p = S.products.find(x => x.id === id); p.stock = !p.stock; render() }
        function delP(id) { if (confirm('حذف المنتج؟')) { S.products = S.products.filter(p => p.id !== id); render() } }
        function editP(id) {
            const p = S.products.find(x => x.id === id);
            modal(`<h3>تعديل المنتج</h3><input id="en" value="${esc(p.name)}"><input id="ep" type="number" value="${p.price}"><select id="ec">${CATS.map(c => `<option ${c === p.cat ? 'selected' : ''}>${c}</option>`).join('')}</select>
 <div class="row"><button class="b-or" onclick="saveP(${id})">حفظ</button><button class="b-ln" onclick="closeM()">إلغاء</button></div>`)
        }
        function saveP(id) { const p = S.products.find(x => x.id === id); p.name = $('#en').value.trim() || p.name; p.price = parseFloat($('#ep').value) || p.price; p.cat = $('#ec').value; closeM(); render() }
        function readCsv(i) {
            const f = i.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => {
                S.csv = r.result.split(/\r?\n/).map(l => l.split(/[,;\t]/).map(c => c.trim())).filter(c => c[0] && !isNaN(parseFloat(c[1]))).map(c => ({ name: c[0], price: parseFloat(c[1]), cat: CATS.includes(c[2]) ? c[2] : CATS[0], desc: c[3] || '' }));
                $('#csvp').innerHTML = S.csv.length ? `<div class="tw"><table>${S.csv.map((x, k) => `<tr><td><input type="checkbox" style="width:auto;margin:0" checked data-k="${k}"></td><td>${esc(x.name)}</td><td>${x.price}</td><td>${esc(x.cat)}</td></tr>`).join('')}</table></div><button class="b-or" onclick="impCsv()">استيراد المنتجات المحددة</button>` : '<p class="err">لم يتم العثور على منتجات صالحة</p>'
            }; r.readAsText(f)
        }
        function impCsv() { document.querySelectorAll('#csvp input:checked').forEach(c => { const x = S.csv[+c.dataset.k]; S.products.push({ id: S.nid++, store: S.myStore, ...x, phone: PHONES[0], q: 20, stock: true, hidden: false }) }); S.csv = []; render() }

        function viewAdmin() {
            const pend = S.stores.filter(s => s.status === 'pending');
            return head('لوحة المدير') + `<main>
 <div class="stats"><div class="stat">المحلات<b>${S.stores.length}</b></div><div class="stat">بانتظار المراجعة<b>${pend.length}</b></div><div class="stat">المنتجات<b>${S.products.length}</b></div></div>
 <div class="card"><h3>مراجعة المحلات الجديدة</h3>${pend.map(s => `<div class="ci"><span><b>${esc(s.name)}</b> <span class="mu">${esc(s.area)}</span></span><span><button class="b-gr" onclick="setSt('${s.id}','approved')">قبول</button> <button class="b-rd" onclick="setSt('${s.id}','rejected')">رفض</button></span></div>`).join('') || '<p class="mu">لا توجد محلات بانتظار المراجعة</p>'}</div>
 <div class="card"><h3>جميع المحلات</h3><div class="tw"><table><tr><th>المحل</th><th>المنطقة</th><th>الحالة</th><th>المنتجات</th></tr>${S.stores.map(s => `<tr><td>${esc(s.name)}</td><td>${esc(s.area)}</td><td><span class="tag ${s.status}">${{ pending: 'قيد المراجعة', approved: 'معتمد', rejected: 'مرفوض' }[s.status]}</span></td><td>${S.products.filter(p => p.store === s.id).length}</td></tr>`).join('')}</table></div></div>
 <div class="card"><h3>إخفاء المنتجات المخالفة أو غير الصحيحة</h3><div class="tw"><table><tr><th>المنتج</th><th>المحل</th><th>السعر</th><th>الحالة</th><th></th></tr>${S.products.map(p => `<tr><td>${esc(p.name)}</td><td>${esc(storeOf(p.store).name)}</td><td class="price">${p.price} EGP</td><td>${p.hidden ? '<span class="tag rejected">مخفي</span>' : '<span class="tag approved">ظاهر</span>'}</td><td><button class="${p.hidden ? 'b-gr' : 'b-nv'}" onclick="hid(${p.id})">${p.hidden ? 'إظهار' : 'إخفاء'}</button></td></tr>`).join('')}</table></div></div></main>`
        }
        function setSt(id, s) { storeOf(id).status = s; render() }
        function hid(id) { const p = S.products.find(x => x.id === id); p.hidden = !p.hidden; render() }

        /* ===== Modal & router ===== */
        function modal(h) { $('#mbody').innerHTML = h; $('#modal').classList.add('show') }
        function closeM() { $('#modal').classList.remove('show') }
        $('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeM() });
        function render() { closeM(); const v = { null: viewLogin, user: viewUser, store: viewStore, admin: viewAdmin }[S.role]; $('#app').innerHTML = v(); if (S.role === 'user') grid() }
        render(); if (S.role === 'user') grid();
    </script>
</body>

</html>
